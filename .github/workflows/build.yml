name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Elle de tetiklenebilir

jobs:

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutuphaneleri kur
        run: pip install customtkinter requests pyinstaller

      - name: EXE derle
        run: pyinstaller --onefile --windowed --name "FonTakip" "fonçekv3.py"

      - name: Windows EXE'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: FonTakip-Windows
          path: dist/FonTakip.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutuphaneleri kur
        run: pip install customtkinter requests pyinstaller

      - name: Mac APP derle
        run: pyinstaller --onefile --windowed --name "FonTakip" "fonçekv3.py"

      - name: Mac dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: FonTakip-Mac
          path: dist/FonTakip
